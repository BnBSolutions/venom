<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gorillaz Crew Merch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="hero wrap">
  <div class="poster">
    <span class="tape tl" aria-hidden="true"></span><span class="tape tr" aria-hidden="true"></span>
    <img src="assets/logo-big.webp" alt="Gorillaz Crew" width="480" height="457">
  </div>
  <h1>Merch Gorillaz Crew</h1>
  <p>Alegi, comanzi, iar noi te sunăm pentru confirmare și livrare.</p>
</header>

<main class="wrap">
  <nav class="filters" aria-label="Categorii" id="filters"></nav>
  <section class="grid" id="grid" aria-live="polite"></section>
  <p class="note">Prețurile sunt în RON. Costul livrării îl afli când confirmăm comanda.</p>
</main>

<div class="cartbar" id="cartbar" hidden>
  <button type="button" id="openCart"><span><span class="count" id="cartCount">0</span>Vezi coșul</span><span class="total" id="cartTotal">0 RON</span></button>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <button type="button" class="closex" id="closeSheet" aria-label="Închide">✕</button>
  <div id="sheetBody"></div>
</div>

</body>
</html>
