<title>Gorillaz Crew · Jocuri</title>

<style>
  :root { --red: #e11820; --yellow: #ffcd00; --ink: #0b0a0e; --panel: rgba(14, 9, 24, 0.86); --text: #ffffff; --muted: #c9bfd9; }
  html, body { margin: 0; height: 100%; background: #0e0b10; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 16px; box-sizing: border-box; pointer-events: none; overflow-y: auto; }
  .hide { display: none !important; }
  .logo { width: min(74vw, 320px); filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .title { font-size: 28px; font-weight: 900; letter-spacing: 3px; color: var(--yellow);
    -webkit-text-stroke: 1.5px var(--ink); text-shadow: 0 3px 0 var(--ink); margin-top: -4px; text-align: center; }
  .panel { pointer-events: auto; background: var(--panel); border: 2px solid var(--ink); border-radius: 16px;
    padding: 14px 16px; width: min(88vw, 340px); box-sizing: border-box; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .btn { display: block; width: 100%; border: 2px solid var(--ink); border-radius: 12px; padding: 13px 10px;
    font-size: 17px; font-weight: 800; color: #fff; background: var(--red); margin: 8px 0 0;
    box-shadow: 0 4px 0 var(--ink); cursor: pointer; font-family: inherit; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.sec { background: #2b2140; }
  .btn.link { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted);
    font-size: 15px; font-weight: 700; padding: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.35; }
  .big { font-size: 46px; font-weight: 900; line-height: 1; margin: 2px 0 6px; }
  .row { display: flex; justify-content: space-between; font-size: 15px; margin: 3px 0; }
  .row b { font-weight: 800; }
  .top h3 { margin: 12px 0 6px; font-size: 14px; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
  .top ol { list-style: none; margin: 0; padding: 0; text-align: left; font-size: 14px; }
  .top li { display: flex; justify-content: space-between; padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .top li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%; }
  .top li.gold span:first-child { color: #ffd34d; font-weight: 800; }
  .tag { display: inline-block; font-size: 12px; color: #ffd34d; font-weight: 800; margin-bottom: 4px; }
  .card { display: flex; align-items: center; gap: 12px; text-align: left; pointer-events: auto; cursor: pointer;
    background: #241a36; border: 2px solid var(--ink); border-radius: 14px; padding: 12px; margin-top: 10px;
    box-shadow: 0 4px 0 var(--ink); }
  .card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .card .ico { font-size: 34px; width: 44px; text-align: center; }
  .card .nm { font-size: 18px; font-weight: 900; }
  .card .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card .go { margin-left: auto; font-size: 22px; color: var(--yellow); font-weight: 900; }
</style>

<script>
(() => {
  "use strict";
  // ================================================================ Telegram
  const tg = window.Telegram && window.Telegram.WebApp;
  // deschis din butonul de jos al botului, Telegram nu trimite initData; platforma e „unknown” doar în afara Telegram
  const inTelegram = !!(tg && ((tg.platform && tg.platform !== "unknown") || tg.initData || /tgWebApp/.test(location.hash)));
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor("#0e0b10"); tg.setBackgroundColor("#0e0b10"); } catch (e) {}
  }
  const haptic = (kind) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind); } catch (e) {} };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ================================================================ topurile primite de la bot (?d=...)
  let info = {};
  try {
    const raw = new URLSearchParams(location.search).get("d");
    if (raw) {
      const b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
      const d = JSON.parse(new TextDecoder().decode(bytes));
      info = d.g || (d.t ? { venomfly: d } : {});
    }
  } catch (e) { /* fără top */ }

  const Drift = (() => {

    function centerAt(s) {

    function extend() {

    function reset() {
      road = [0, 0]; cones = []; smoke = []; curSlope = 0; slopeTarget = 0; nextTurn = 700;
      while (road.length < 120) extend();
      car = { x: 0, s: 0, a: 0, va: 0 };
      cam = 0; dist = 0; driftPts = 0; combo = 1; t = 0; steer = 0; held = 0; lastS = 0; driftNow = false; comboShow = 0;
    }
    function speed() { return 250 + Math.min(dist / 30, 280); }
    function update(dt, st) {
      if (st === "idle") { car.s += 120 * dt; lastS = car.s; car.x = centerAt(car.s); cam = car.x; ageSmoke(dt); return; }
      if (st === "ready") { car.s += 60 * dt; car.x += (centerAt(car.s) - car.x) * 0.1; car.a = 0; car.va = 0; cam = car.x; ageSmoke(dt); return; }

    const side = e.code === "ArrowLeft" || e.code === "KeyA" ? -1 : e.code === "ArrowRight" || e.code === "KeyD" ? 1 : 0;
    if (e.code === "Space" || e.code === "ArrowUp" || side) {
      e.preventDefault();
      if (G.state === "idle" || G.state === "over") startRound();
      G.game.press(side || 1);
    }
  });
  window.addEventListener("keyup", (e) => { keys.delete(e.code); G.game.release(0); });
  window.addEventListener("resize", resize);

  // ================================================================ bucla principală (pas fix)
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= STEP) {
      const st = G.state === "hub" || G.state === "over" ? "idle" : G.state;
      const ev = G.game.update(STEP, st);
      if (ev === "crash" && G.state === "play") crash();
      if (G.state === "dead" && performance.now() - G.deadAt > 700) showOver();
      acc -= STEP;
    }
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    G.game.draw(G.state === "hub" || G.state === "over" ? "idle" : G.state);
    requestAnimationFrame(frame);
  }
  resize(); Fly.reset(); Drift.reset(); openHub();
  requestAnimationFrame(frame);

  // pentru teste automate
  window.__vg = { G, GAMES, openMenu, startRound, openHub };
})();
</script>
