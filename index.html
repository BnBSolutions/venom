<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Venom Fly</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --red: #e11820; --ink: #0b0a0e; --panel: rgba(14, 9, 24, 0.84); --text: #ffffff; --muted: #c9bfd9; }
  html, body { margin: 0; height: 100%; background: #1a0f2e; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 16px; box-sizing: border-box; pointer-events: none; }
  .hide { display: none !important; }
  .logo { width: min(78vw, 340px); filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .title { font-size: 30px; font-weight: 900; letter-spacing: 3px; color: var(--text);
    -webkit-text-stroke: 1.5px var(--ink); text-shadow: 0 3px 0 var(--ink); margin-top: -4px; }
  .panel { pointer-events: auto; background: var(--panel); border: 2px solid var(--ink); border-radius: 16px;
    padding: 14px 16px; width: min(88vw, 340px); box-sizing: border-box; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .btn { display: block; width: 100%; border: 2px solid var(--ink); border-radius: 12px; padding: 13px 10px;
    font-size: 17px; font-weight: 800; color: #fff; background: var(--red); margin: 8px 0 0;
    box-shadow: 0 4px 0 var(--ink); cursor: pointer; font-family: inherit; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.sec { background: #2b2140; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.35; }
  .big { font-size: 46px; font-weight: 900; line-height: 1; margin: 2px 0 6px; }
  .row { display: flex; justify-content: space-between; font-size: 15px; margin: 3px 0; }
  .row b { font-weight: 800; }
  .top h3 { margin: 12px 0 6px; font-size: 14px; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
  .top ol { list-style: none; margin: 0; padding: 0; text-align: left; font-size: 14px; }
  .top li { display: flex; justify-content: space-between; padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .top li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%; }
  .top li.gold span:first-child { color: #ffd34d; font-weight: 800; }
  .tag { display: inline-block; font-size: 12px; color: #ffd34d; font-weight: 800; margin-bottom: 4px; }
</style>

  // ---------------------------------------------------------------- lumea jocului

    for (const [par, base, hMin, hMax, col] of [[0.18, 0.62, 60, 150, "#4a2a63"], [0.42, 0.72, 40, 120, "#2a1838"]]) {

      while (x < W + 400) { const w = 26 + rnd() * 46; b.push([x, w, hMin + rnd() * (hMax - hMin), rnd()]); x += w + 2 + rnd() * 8; }

  }

    ctx.fillStyle = pg; ctx.fillRect(x, y, PIPE_W, h);
    const capH = 26, cy = top ? y + h - capH : y;
    ctx.fillStyle = "#0b0a0e"; ctx.fillRect(x - 8, cy - 2, PIPE_W + 16, capH + 4);
    ctx.fillStyle = "#e11820"; ctx.fillRect(x - 6, cy, PIPE_W + 12, capH);
    ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(x - 6, cy + 3, PIPE_W + 12, 4);
  }

  function outlined(text, x, y, size) {
    ctx.font = `900 ${size}px system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineJoin = "round"; ctx.lineWidth = size / 5; ctx.strokeStyle = "#0b0a0e";
    ctx.strokeText(text, x, y); ctx.fillStyle = "#ffffff"; ctx.fillText(text, x, y);
  }

  // ---------------------------------------------------------------- ecrane
  function showMenu() { state = "menu"; $("menu").classList.remove("hide"); $("over").classList.add("hide"); }
  function startRound() {
    $("menu").classList.add("hide"); $("over").classList.add("hide");
    reset(); state = "ready";
  }
  function showOver() {
    state = "over";
    $("score").textContent = score;
    $("sessBest").textContent = sessBest.s;
    const rec = sessBest.s > (data.b || 0) && score === sessBest.s && score > 0;
    $("newRec").classList.toggle("hide", !rec);
    if (data.b > 0) { $("topBestRow").classList.remove("hide"); $("topBest").textContent = data.b; }
    $("sendBtn").classList.toggle("hide", !inTelegram);
    $("sendBtn").textContent = `🏆 Trimite scorul ${sessBest.s} în top`;
    $("outside").classList.toggle("hide", inTelegram);
    $("over").classList.remove("hide");
  }
  function sendScore() {
    if (!inTelegram) return;
    try {
      tg.sendData(JSON.stringify({ g: "venomfly", v: 1, s: sessBest.s, t: sessBest.t, f: sessBest.f }));
    } catch (e) { /* trimiterea se poate face doar din butonul botului */ }
  }

  $("playBtn").addEventListener("click", (e) => { e.stopPropagation(); startRound(); });
  $("againBtn").addEventListener("click", (e) => { e.stopPropagation(); startRound(); });
  $("sendBtn").addEventListener("click", (e) => { e.stopPropagation(); sendScore(); });
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); flap(); });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); if (state === "menu" || state === "over") startRound(); else flap(); }
  });
  window.addEventListener("resize", resize);

  // ---------------------------------------------------------------- bucla principală (pas fix: aceeași viteză pe orice ecran)
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }
  resize(); reset(); scroll = 0; showMenu();
  requestAnimationFrame(frame);

  // pentru teste automate
  window.__vf = { get state() { return state; }, get score() { return score; }, get best() { return sessBest; },
                  flap, startRound, get p() { return p; }, get pipes() { return pipes; } };
})();
</script>
